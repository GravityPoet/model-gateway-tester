[project]
name = "model-gateway-tester"
version = "0.1.0"
description = "A simple tool for comparing model gateways with dynamic private benchmarks and short-cycle shadow audits."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "GravityPoet" }
]
keywords = ["llm", "audit", "benchmark", "gateway", "shadow-audit", "reasoning"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[project.scripts]
model-gateway-tester = "llm_shadow_audit:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
